[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevzip"
version = "0.2.0"
description = "Lossless byte compressor that decodes in parallel rounds with a small transformer"
readme = "jevzip/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
bench = ["zstandard", "brotli"]

[project.scripts]
jevzip = "jevzip.__main__:main"

[project.urls]
Homepage = "https://github.com/jereeeschrome-agent/jevzip"

[tool.setuptools]
packages = ["jevzip"]

[tool.setuptools.package-data]
jevzip = ["assets.json", "datasets.json", "testdata/**/*"]
